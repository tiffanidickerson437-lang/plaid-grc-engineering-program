# ISO/IEC 27701:2019 mapped over the Living Control Set — explicit STRM entries.
#
# WHY THIS FILE EXISTS
# -------------------
# Plaid's trust center lists ISO 27701 as a credential it holds (security.plaid.com,
# fetched 2026-08-15). The Plaid GRC Engineering posting names it directly: "Working
# knowledge of SOC 2, ISO 27001/27701, and NIST CSF/800-53, with the ability to map
# controls to evidence and crosswalk a single control across frameworks."
#
# The engine could not render it. Configuring `iso27701` produced a framework the
# renderer recognised but the crosswalk had never mapped, so it dropped from the payload
# with zero controls and no warning. That is the gap this file closes.
#
# DIRECTIONALITY AND ENTRY SHAPE are defined ONCE in mappings/strm-schema.yaml: the owned
# control is the Reference document, the framework requirement is the Focal document.
# Every relationship below reads as "the ISO 27701 requirement, relative to our control."
#
# ⚠ SOURCE HONESTY — READ BEFORE APPROVING
# ----------------------------------------
# ISO/IEC 27701:2019 is a paywalled standard. The requirement IDs and short titles below
# were assembled from secondary sources (the SCF STRM set and published ISO 27701
# structure summaries), NOT from a purchased copy of the standard. They are therefore
# DRAFT in the strongest sense of the word:
#
#   - The control IDs and clause numbering follow the published Annex A (PII controllers)
#     and Annex B (PII processors) structure and are believed correct.
#   - The short titles are paraphrase, never the standard's normative text. Standard text
#     is copyrighted and is deliberately not reproduced here.
#   - NO relationship_type or relationship_strength below has been confirmed by a human
#     against the normative text. They are the author's reading.
#
# A human reviews and approves via pull request; the merge is the authorization. Nothing
# in this file is a claim about Plaid's ISO 27701 implementation, its certificate scope,
# or its audit outcome — none of which are public.
#
# THE CONTROLLER / PROCESSOR QUESTION
# -----------------------------------
# ISO 27701 clause 5.2.1 requires an organization to determine its role as PII controller,
# PII processor, or both, because that determination selects Annex A, Annex B, or both.
# For a consumer-permissioned financial data network the answer is plausibly BOTH — a
# controller for its own direct end-user relationship (the consumer-facing portal and data
# subject request path) and a processor acting on the instructions of the developer
# customers it serves. This draft therefore maps against both annexes and flags the role
# determination itself as the first thing a human must confirm. Getting this wrong inverts
# the whole mapping, which is why it is called out at the top rather than buried.

strm_mapping:
  framework_id: iso27701
  framework_name: "ISO/IEC 27701:2019 (Privacy Information Management System)"
  status: DRAFT_PENDING_HUMAN_APPROVAL
  schema: mappings/strm-schema.yaml
  basis_checked: 2026-08-15
  requirements_source: >
    Secondary. Annex A / Annex B structure and identifiers assembled from published
    summaries and the SCF STRM set. NOT verified against a purchased copy of
    ISO/IEC 27701:2019. Verify before approval.
  method: >
    Explicit STRM authored per mappings/strm-schema.yaml. Each entry states the
    relationship of the ISO 27701 requirement to the owned control, a calibrated
    strength, and — where the relationship is superset-of or intersects-with — the
    named delta that a human must design coverage for. No relationship was generated
    by keyword heuristic and none was generated by a model.

  # Blocking questions a human must answer before this draft can be approved.
  open_questions:
    - id: OQ-01
      question: >
        Is the certified role PII controller, PII processor, or both? This selects
        Annex A, Annex B, or both, and changes which entries below are in scope.
      blocking: true
    - id: OQ-02
      question: >
        What is the certificate's scope statement? ISO 27701 is certifiable only as an
        extension to an ISO 27001 ISMS, so the PIMS scope inherits the ISMS boundary.
        Not public; must come from the certificate.
      blocking: true
    - id: OQ-03
      question: >
        Which requirement IDs and titles differ from the normative text? Every entry
        below carries a paraphrased title from a secondary source.
      blocking: true

  entries:

    # ---- Clause 5: PIMS-specific requirements related to ISO/IEC 27001 ----

    - mapping:
        master_control_id: "GOV-01"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "5.2.1"
        external_requirement_title: "Understanding the organization and its context — determine role as PII controller and/or processor"
        strm_parameters:
          relationship_type: "superset-of"
          relationship_strength: 5
        delta: >
          GOV-01 establishes program scope and authority generally. It does not require the
          specific controller/processor role determination that clause 5.2.1 mandates, and
          that determination drives which annex applies. Human design required.
        references:
          - "02-controls/control-library.yaml#GOV-01"

    - mapping:
        master_control_id: "RSK-01"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "5.4.1.2"
        external_requirement_title: "Information security risk assessment extended to privacy risk to PII principals"
        strm_parameters:
          relationship_type: "intersects-with"
          relationship_strength: 6
        delta: >
          RSK-01 quantifies organizational loss exposure under FAIR. Clause 5.4.1.2 requires
          assessment of risk TO THE PII PRINCIPAL, which is a different subject and can
          diverge sharply from organizational loss. The register needs a principal-harm axis.
        references:
          - "02-controls/control-library.yaml#RSK-01"
          - "01-risk-management/risk-register.yaml"

    - mapping:
        master_control_id: "RSK-02"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "5.4.1.3"
        external_requirement_title: "Information security risk treatment extended to privacy"
        strm_parameters:
          relationship_type: "subset-of"
          relationship_strength: 7
        references:
          - "02-controls/control-library.yaml#RSK-02"

    # ---- Annex A: PII controllers ----

    - mapping:
        master_control_id: "PRI-01"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "A.7.2.1"
        external_requirement_title: "Identify and document purpose for PII processing"
        strm_parameters:
          relationship_type: "equal-to"
          relationship_strength: 8
        references:
          - "02-controls/control-library.yaml#PRI-01"

    - mapping:
        master_control_id: "PRI-01"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "A.7.2.2"
        external_requirement_title: "Identify lawful basis for processing"
        strm_parameters:
          relationship_type: "intersects-with"
          relationship_strength: 6
        delta: >
          Lawful-basis determination is a legal judgment, not a security control. The engine
          records the basis; it does not determine it. Joint ownership with Legal/Privacy.
        references:
          - "02-controls/control-library.yaml#PRI-01"

    - mapping:
        master_control_id: "PRI-02"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "A.7.2.3"
        external_requirement_title: "Determine when and how consent is obtained"
        strm_parameters:
          relationship_type: "equal-to"
          relationship_strength: 8
        references:
          - "02-controls/control-library.yaml#PRI-02"

    - mapping:
        master_control_id: "PRI-02"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "A.7.2.4"
        external_requirement_title: "Provide mechanism to modify or withdraw consent"
        strm_parameters:
          relationship_type: "intersects-with"
          relationship_strength: 7
        delta: >
          Withdrawal must propagate to every downstream party that received the PII, not only
          to the collection point. For a data network that means revocation reaching the
          connected applications, which is an architectural obligation the control states but
          does not yet evidence.
        references:
          - "02-controls/control-library.yaml#PRI-02"

    - mapping:
        master_control_id: "RSK-01"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "A.7.2.5"
        external_requirement_title: "Privacy impact assessment"
        strm_parameters:
          relationship_type: "superset-of"
          relationship_strength: 5
        delta: >
          A PIA/DPIA is a distinct assessment instrument with its own trigger conditions,
          template and record. The engine has no PIA artifact. Named build.
        references:
          - "02-controls/control-library.yaml#RSK-01"

    - mapping:
        master_control_id: "TPM-01"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "A.7.2.6"
        external_requirement_title: "Contracts with PII processors"
        strm_parameters:
          relationship_type: "subset-of"
          relationship_strength: 8
        references:
          - "02-controls/control-library.yaml#TPM-01"

    - mapping:
        master_control_id: "AST-01"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "A.7.2.8"
        external_requirement_title: "Records related to processing PII"
        strm_parameters:
          relationship_type: "intersects-with"
          relationship_strength: 6
        delta: >
          AST-01 inventories systems and assets. A record of processing activities is
          organized by processing purpose, not by asset, and carries fields (categories of
          principals, recipients, transfer basis, retention) an asset inventory does not.
        references:
          - "02-controls/control-library.yaml#AST-01"

    - mapping:
        master_control_id: "PRI-02"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "A.7.3.1"
        external_requirement_title: "Determining and fulfilling obligations to PII principals"
        strm_parameters:
          relationship_type: "superset-of"
          relationship_strength: 5
        delta: >
          Data subject request intake, identity proofing, fulfilment within a statutory clock,
          and the refusal path each need an evidenced workflow. The engine states the
          obligation; it does not yet compute fulfilment timeliness.
        references:
          - "02-controls/control-library.yaml#PRI-02"

    - mapping:
        master_control_id: "DCH-01"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "A.7.4.1"
        external_requirement_title: "Limit collection"
        strm_parameters:
          relationship_type: "intersects-with"
          relationship_strength: 7
        delta: >
          DCH-01 classifies and inventories what IS held. Collection limitation constrains what
          MAY be acquired, which is enforced at the API contract rather than at the datastore.
          See 03-secure-development/openapi-minimization/ — this delta is the reason that
          instrument exists.
        references:
          - "02-controls/control-library.yaml#DCH-01"
          - "03-secure-development/openapi-minimization/README.md"

    - mapping:
        master_control_id: "DCH-01"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "A.7.4.2"
        external_requirement_title: "Limit processing"
        strm_parameters:
          relationship_type: "intersects-with"
          relationship_strength: 6
        delta: >
          Purpose limitation at processing time requires binding each access to a declared
          purpose. AAT-01's purpose-bound authorization model is the nearest existing
          mechanism; extending it from agents to all principals is the build.
        references:
          - "02-controls/control-library.yaml#DCH-01"
          - "02-controls/control-library.yaml#AAT-01"

    - mapping:
        master_control_id: "DCH-02"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "A.7.4.5"
        external_requirement_title: "PII de-identification and deletion at end of processing"
        strm_parameters:
          relationship_type: "equal-to"
          relationship_strength: 8
        references:
          - "02-controls/control-library.yaml#DCH-02"

    - mapping:
        master_control_id: "DCH-02"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "A.7.4.7"
        external_requirement_title: "Retention"
        strm_parameters:
          relationship_type: "equal-to"
          relationship_strength: 8
        references:
          - "02-controls/control-library.yaml#DCH-02"

    - mapping:
        master_control_id: "DCH-02"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "A.7.4.8"
        external_requirement_title: "Disposal"
        strm_parameters:
          relationship_type: "subset-of"
          relationship_strength: 7
        references:
          - "02-controls/control-library.yaml#DCH-02"
          - "02-controls/control-library.yaml#AST-03"

    - mapping:
        master_control_id: "CRY-01"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "A.7.4.9"
        external_requirement_title: "PII transmission controls"
        strm_parameters:
          relationship_type: "subset-of"
          relationship_strength: 8
        references:
          - "02-controls/control-library.yaml#CRY-01"

    - mapping:
        master_control_id: "PRI-01"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "A.7.5.1"
        external_requirement_title: "Identify basis for PII transfer between jurisdictions"
        strm_parameters:
          relationship_type: "superset-of"
          relationship_strength: 4
        delta: >
          Cross-border transfer basis (adequacy, SCCs, derogations) is a legal instrument
          register the engine does not carry. Directly material to an organization operating
          US, EU and UK entities. Named build.
        references:
          - "02-controls/control-library.yaml#PRI-01"

    - mapping:
        master_control_id: "PRI-01"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "A.7.5.4"
        external_requirement_title: "Records of PII disclosure to third parties"
        strm_parameters:
          relationship_type: "intersects-with"
          relationship_strength: 6
        delta: >
          Disclosure logging must record recipient, purpose, lawful basis and the PII
          categories disclosed — a narrower and more specific record than general access
          logging under MON-01.
        references:
          - "02-controls/control-library.yaml#PRI-01"
          - "02-controls/control-library.yaml#MON-01"

    # ---- Annex B: PII processors ----

    - mapping:
        master_control_id: "TPM-01"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "B.8.2.1"
        external_requirement_title: "Customer agreement"
        strm_parameters:
          relationship_type: "intersects-with"
          relationship_strength: 6
        delta: >
          TPM-01 governs the organization's own vendors (looking down the chain). B.8.2.1
          governs the agreement with the customer whose PII is processed (looking up the
          chain). Same artifact class, opposite direction; the engine has no upward-facing
          control today.
        references:
          - "02-controls/control-library.yaml#TPM-01"

    - mapping:
        master_control_id: "PRI-01"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "B.8.2.2"
        external_requirement_title: "Organization's purposes — process only on documented customer instructions"
        strm_parameters:
          relationship_type: "superset-of"
          relationship_strength: 4
        delta: >
          The processor must not process for its own purposes beyond the customer's
          instruction. Evidencing that negative is materially harder than evidencing a
          positive control, and it is the single most consequential processor obligation for
          a data network. Named build.
        references:
          - "02-controls/control-library.yaml#PRI-01"

    - mapping:
        master_control_id: "PRI-01"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "B.8.2.4"
        external_requirement_title: "Infringing instruction — notify the customer"
        strm_parameters:
          relationship_type: "no-relationship"
          relationship_strength: 1
        delta: >
          No owned control covers the duty to tell a customer that their own instruction
          appears to breach applicable law. Genuinely absent; a new control is needed.
        references:
          - "02-controls/control-library.yaml#PRI-01"

    - mapping:
        master_control_id: "IRO-01"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "B.8.2.6"
        external_requirement_title: "Records related to processing PII (processor)"
        strm_parameters:
          relationship_type: "intersects-with"
          relationship_strength: 5
        delta: >
          A processor's processing record is maintained per customer and must be producible
          to that customer on request, which is a different retrieval path from the
          organization's own internal asset and incident records. Neither IRO-01 nor AST-01
          is organized per-customer, so the record exists but cannot be sliced the way the
          requirement expects. Human design required.
        references:
          - "02-controls/control-library.yaml#IRO-01"
          - "02-controls/control-library.yaml#AST-01"

    - mapping:
        master_control_id: "TPM-02"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "B.8.5.6"
        external_requirement_title: "Disclosure of subcontractors used to process PII"
        strm_parameters:
          relationship_type: "subset-of"
          relationship_strength: 7
        references:
          - "02-controls/control-library.yaml#TPM-02"

    - mapping:
        master_control_id: "TPM-02"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "B.8.5.8"
        external_requirement_title: "Change of subcontractor to process PII — notify and allow objection"
        strm_parameters:
          relationship_type: "intersects-with"
          relationship_strength: 6
        delta: >
          Vendor onboarding is covered. The customer-notification-and-objection window on a
          subprocessor change is a contractual commitment with a clock, and the engine does
          not compute clock adherence.
        references:
          - "02-controls/control-library.yaml#TPM-02"

    - mapping:
        master_control_id: "IRO-01"
        external_framework: "ISO/IEC 27701:2019"
        external_requirement_id: "B.8.5.5"
        external_requirement_title: "Legally binding PII disclosures — law enforcement requests"
        strm_parameters:
          relationship_type: "superset-of"
          relationship_strength: 4
        delta: >
          Government/law-enforcement request handling — legal review, customer notification
          where permitted, and a transparency record — is a distinct workflow from security
          incident response. Named build.
        references:
          - "02-controls/control-library.yaml#IRO-01"
